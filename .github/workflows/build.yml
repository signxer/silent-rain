name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  RELEASE_REPO: signxer/Moisten

jobs:
  # ── Windows ──
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 打包内置 Chromium：PLAYWRIGHT_BROWSERS_PATH=0 会把浏览器装进
      # playwright/driver/package/.local-browsers，随包分发后冻结版才能启动浏览器
      - name: Install Playwright Chromium (bundled)
        shell: bash
        run: |
          PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium

      - name: Get version
        id: version
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Build GUI EXE
        shell: bash
        run: |
          BROWSER_DIR=$(python -c "import playwright, os; print(os.path.join(os.path.dirname(playwright.__file__), 'driver', 'package', '.local-browsers'))")
          pyinstaller -F -w --icon=icon.ico \
            --add-data="icon.png;." --add-data="VERSION;." \
            --add-data="$BROWSER_DIR;playwright/driver/package/.local-browsers" \
            --name=Moisten gui.py

      - name: Rename
        shell: bash
        run: mv dist/Moisten.exe "dist/Moisten-${{ steps.version.outputs.VERSION }}-Windows.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          retention-days: 1

  # ── macOS ──
  # macos-13 = Intel runner，产物 x86_64：Intel 原生运行，Apple Silicon 走 Rosetta
  build-macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install pyinstaller

      # 打包内置 Chromium（不再删除 .local-browsers）
      - name: Install Playwright Chromium (bundled)
        run: |
          PLAYWRIGHT_BROWSERS_PATH=0 python3 -m playwright install chromium

      - name: Get version
        id: version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Create icon.icns
        run: |
          mkdir -p icon.iconset
          sips -z 16 16 icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32 icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32 icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64 icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128 icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256 icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256 icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512 icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512 icon.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns
          rm -rf icon.iconset

      - name: Build GUI .app
        run: |
          BROWSER_DIR=$(python3 -c "import playwright, os; print(os.path.join(os.path.dirname(playwright.__file__), 'driver', 'package', '.local-browsers'))")
          pyinstaller -F -w --icon=icon.icns \
            --add-data="icon.png:." --add-data="VERSION:." \
            --add-data="$BROWSER_DIR:playwright/driver/package/.local-browsers" \
            --name=Moisten gui.py

      - name: Create DMG
        run: |
          mkdir -p dmg-dist dist
          # 创建 .app 包装
          mkdir -p Moisten.app/Contents/MacOS
          mkdir -p Moisten.app/Contents/Resources
          cp dist/Moisten Moisten.app/Contents/MacOS/
          cp icon.png Moisten.app/Contents/Resources/
          cat > Moisten.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>Moisten</string>
          <key>CFBundleIconFile</key><string>icon</string>
          <key>CFBundleName</key><string>Moisten</string>
          <key>CFBundleIdentifier</key><string>com.moisten.app</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>${{ steps.version.outputs.VERSION }}</string>
          <key>CFBundleShortVersionString</key><string>${{ steps.version.outputs.VERSION }}</string>
          <key>LSMinimumSystemVersion</key><string>10.15</string>
          </dict></plist>
          EOF
          # 校验 plist 合法性，非法直接失败（避免发布打不开的 .app）
          plutil -lint Moisten.app/Contents/Info.plist
          cp -r Moisten.app dmg-dist/
          ln -sf /Applications dmg-dist/Applications
          hdiutil create -volname Moisten -srcfolder dmg-dist -ov -format UDZO dist/Moisten-${{ steps.version.outputs.VERSION }}-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          retention-days: 1

  # ── Release ──
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files
        run: find artifacts -type f

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*

      - name: Sync to release repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          # 只处理 tag 触发；手动触发（分支名）直接跳过，避免产生垃圾 release
          case "$TAG" in v*) ;; *) echo "跳过：非 tag 触发 ($TAG)"; exit 0 ;; esac
          VER="${TAG#v}"
          # 从git commits自动生成更新日志
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1 || true)
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            NOTES=$(git log ${PREV_TAG}..${TAG} --pretty=format:"- %s" --no-merges | head -20)
          else
            NOTES=$(git log --pretty=format:"- %s" --no-merges -10)
          fi
          # 更新本仓库 CHANGELOG.md（用 API 直接写，避免 detached HEAD 上 git push 失败被吞）
          NEW_CHANGELOG="# 更新日志

          ## ${VER}
          ${NOTES}
          $(cat CHANGELOG.md)"
          SHA=$(gh api repos/${{ github.repository }}/contents/CHANGELOG.md --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            gh api repos/${{ github.repository }}/contents/CHANGELOG.md \
              --method PUT \
              --field message="docs: CHANGELOG ${VER}" \
              --field content="$(echo "$NEW_CHANGELOG" | base64)" \
              --field sha="$SHA"
          fi
          # 创建release（发布仓库）
          gh release create "${TAG}" \
            --repo "$RELEASE_REPO" \
            --title "润物 Moisten ${TAG}" \
            --notes "$NOTES" \
            artifacts/**/*
          # 更新releases.json（含更新日志）
          WIN_SIZE=$(stat -c%s artifacts/**/*Windows*.exe 2>/dev/null || echo "0")
          MAC_SIZE=$(stat -c%s artifacts/**/*macOS*.dmg 2>/dev/null || echo "0")
          NOTES_JSON=$(echo "$NOTES" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))")
          cat > /tmp/releases.json << EOF
          {"tag":"${TAG}","assets":[{"name":"Windows","file":"Moisten-${VER}-Windows.exe","size":${WIN_SIZE}},{"name":"macOS","file":"Moisten-${VER}-macOS.dmg","size":${MAC_SIZE}}],"notes":${NOTES_JSON}}
          EOF
          gh api repos/$RELEASE_REPO/contents/releases.json \
            --method PUT \
            --field message="update releases.json for ${TAG}" \
            --field content="$(base64 < /tmp/releases.json)" \
            --field sha="$(gh api repos/$RELEASE_REPO/contents/releases.json --jq '.sha')"

      - name: Cleanup artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[].id' | \
            while read id; do gh api repos/${{ github.repository }}/actions/artifacts/$id -X DELETE 2>/dev/null; done || true

      - name: Update VERSION in repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          case "$TAG" in v*) ;; *) exit 0 ;; esac
          VER="${TAG#v}"
          SHA=$(gh api repos/${{ github.repository }}/contents/VERSION --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            gh api repos/${{ github.repository }}/contents/VERSION \
              --method PUT \
              --field message="chore: VERSION ${VER}" \
              --field content="$(echo -n "$VER" | base64)" \
              --field sha="$SHA"
          fi
